apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: test-syft-overlay-dir
spec:
  description: >
    Alternative: pull image, mount via unshare, scan with
    dir: provider. Zero temp disk.
  volumes:
    - name: containers-storage
      emptyDir: {}
    - name: shared
      emptyDir: {}
  steps:
    - name: test
      image: quay.io/konflux-ci/task-runner:1.6.0@sha256:1abfe4e50d4e961d0fd9790202565f93ee650fe8dfc50932c94989acba10485f
      volumeMounts:
        - name: containers-storage
          mountPath: /var/lib/containers
        - name: shared
          mountPath: /shared
      computeResources:
        requests:
          memory: 4Gi
          cpu: 1100m
        limits:
          memory: 4Gi
          cpu: 1100m
      securityContext:
        runAsUser: 0
        capabilities:
          add:
            - SETFCAP
      script: |
        #!/bin/bash
        set -euo pipefail

        microdnf -y install time

        testimage=quay.io/redhat-user-workloads/ramalama-tenant/rocm-tools:f522c7fabbf9e690fa708b67d53b153c12cd34d5-linux-d160-m4xlarge-amd64

        buildah pull "$testimage"

        unshare --map-root-user --map-auto --mount -- bash -c '
          set -euo pipefail

          testimage="'"$testimage"'"
          ctr=$(buildah from "$testimage")
          mnt=$(buildah mount "$ctr")

          /usr/bin/time -v \
            syft scan "dir:$mnt" \
              --override-default-catalogers image \
              -o spdx-json@2.3=/shared/sbom-image.json \
              2> /tmp/time.txt &
          pid=$!

          peak_tmp=0
          while kill -0 "$pid" 2>/dev/null; do
            cur=$(du -sk /tmp 2>/dev/null | cut -f1)
            [ "$cur" -gt "$peak_tmp" ] && peak_tmp=$cur
            sleep 5
          done
          wait "$pid"

          echo "=== Results ==="
          grep -E "(Maximum resident|wall clock)" /tmp/time.txt
          echo "Peak /tmp: $((peak_tmp / 1024)) MiB"

          buildah unmount "$ctr"
          buildah rm "$ctr"
        '
